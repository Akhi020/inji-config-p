<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>$titleName</title>
    <!-- Ensure no default browser spacing -->
    <style> body { margin: 0; padding: 0; } </style>
</head>
<body #if ($textColor) style="color: $textColor;" #end>
<!-- Main container: removed bottom padding explicitly -->
<div #if ($backgroundColor) 
        style="background: $backgroundColor; border: 1px $textColor solid; border-radius: 15px; padding: 10px 10px 0 10px;" 
     #else 
        style="border: 2px black solid; border-radius: 15px; padding: 10px 10px 0 10px;" 
     #end>

    <!-- Title Section -->
    <div style="text-align: center; padding: 10px 0; font-weight: bold;"> <!-- Reduced padding -->
        <span style="font-size: 16px;">$titleName</span>
    </div>

    <!-- Content Row -->
    <div style="display: flex; justify-content: space-between; gap: 20px;">
        <!-- Left Column (Icons/QR) -->
        <div style="margin: 20px; flex-shrink: 0;"> <!-- Reduced margin -->
            <!-- User Icon/Image -->
            #if (!$face)
            <div style="float: left; width: 100px; height: 100px; background: white; border: 1px solid grey; border-radius: 10px;">
                <img style="margin: 25px; width: 50px; height: 50px;" 
                     src="https://raw.githubusercontent.com/challabeehyv/mimoto-config/main/user-icon.png" 
                     alt="User Icon" />
            </div>
            #else
            <img style="width: 100px; height: 100px; border-radius: 10px;" src="$face" alt="User Image" />
            #end

            <!-- Logo and QR Code -->
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;">
                <img src="$logoUrl" alt="Logo" style="width: 100px; height: auto;" />
                <img src="data:image/png;base64,$qrCodeImage" alt="QR Code" style="width: 100px; height: 100px;" />
            </div>
        </div>

        <!-- Right Column (User Details) -->
        <div style="padding: 10px 20px 0 0; flex-grow: 1;"> <!-- Trimmed bottom padding -->
            #foreach($entry in $rowProperties.entrySet())
            #if($entry.value)
            <div style="margin-bottom: 8px;">
                <div style="font-weight: bold; font-size: 16px;">$entry.key</div>
                <div style="font-size: 16px; word-break: break-word;">$entry.value</div>
            </div>
            #end
            #end
        </div>
    </div>
</div>
</body>
</html>
